<script>
const KEY='nexo_fin_v1';
const CATS=['Mercado','Alimentação','Transporte','Lazer','Saúde','Moradia','Contas','Compras','Educação','Assinaturas','Estoque da loja','Outros'];
const METHODS={card:'Cartão',cash:'Dinheiro',debit:'Débito',pix:'Pix'};
const POTS=['Reserva','Emergência'];
const INCOME_CATS=['Vendas','Salário extra','Freelance','Reembolso','Presente','Outros'];
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let S, tab='home', sub='res', exsub='out', viewMonth='', Q='', FC='', TOAST_ACT=null, closeMonth='', ssub='sale';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cnt=n=>`<span class="cnt" data-n="${n||0}">${brl(n)}</span>`;
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const num=s=>{s=String(s??'').trim().replace(/[^\d.,-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n};
const fmtDate=d=>d?d.split('-').reverse().join('/'):'';
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);

function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}norm(d)}
function norm(d){
  S=Object.assign({cards:[],expenses:[],goals:[],reserve:{monthly:0,moves:[]},invest:[],salary:{value:0,day:0},fixed:[],income:[],fixedPaid:{},budgets:{},payments:[],goalLog:[],store:{sales:[],restock:[]},profile:'personal',name:'Yuri',lastBackup:'',theme:'auto'},d||{});
  S.reserve=Object.assign({monthly:0,moves:[]},S.reserve||{});
  S.salary=Object.assign({value:0,day:0},S.salary||{});
  if(!Array.isArray(S.fixed))S.fixed=[];
  if(!Array.isArray(S.income))S.income=[];
  if(!S.fixedPaid||typeof S.fixedPaid!=='object')S.fixedPaid={};
  if(!S.budgets||typeof S.budgets!=='object')S.budgets={};
  if(!Array.isArray(S.payments))S.payments=[];
  if(!Array.isArray(S.goalLog))S.goalLog=[];
  S.store=Object.assign({sales:[],restock:[]},S.store||{});if(!Array.isArray(S.store.sales))S.store.sales=[];if(!Array.isArray(S.store.restock))S.store.restock=[];
  if(S.profile!=='store')S.profile='personal';}

function daysUntil(d){const n=new Date(),y=n.getFullYear(),mo=n.getMonth(),dim=(yy,mm)=>new Date(yy,mm+1,0).getDate();const t0=new Date(y,mo,n.getDate());let t=new Date(y,mo,Math.min(d,dim(y,mo)));if(t<t0)t=new Date(y,mo+1,Math.min(d,dim(y,mo+1)));return Math.round((t-t0)/864e5)}

function donut(items,label,center){
  items=items.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const tot=sum(items,x=>x[1]);if(tot<=0)return '';
  if(items.length>6){const rest=sum(items.slice(6),x=>x[1]);items=items.slice(0,6).concat([['Demais',rest]])}

  const leg=items.map(([k,v],i)=>{const col=k==='Demais'?PAL[8]:PAL[i%8],pc=v/tot*100;

async function gModels(key,force){
  try{const c=JSON.parse(localStorage.getItem(GMODEL)||'null');if(!force&&c&&c.l&&Date.now()-c.t<6048e5)return c.l}catch(e){}
  let list=[];
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(key));
    if(r.ok){const j=await r.json();
      const ok=(j.models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace('models/',''));
      const ver=n=>parseFloat((n.match(/^gemini-([\d.]+)-/)||[0,0])[1]);
      const fl=ok.filter(n=>/^gemini-[\d.]+-flash$/.test(n)).sort((a,b)=>ver(b)-ver(a));
      const lt=ok.filter(n=>/^gemini-[\d.]+-flash-lite$/.test(n)).sort((a,b)=>ver(b)-ver(a));
      list=fl.slice(0,3).concat(lt.slice(0,1))}
  }catch(e){}
  ['gemini-2.5-flash','gemini-2.5-flash-lite'].forEach(n=>{if(!list.includes(n))list.push(n)});
  try{localStorage.setItem(GMODEL,JSON.stringify({l:list,t:Date.now()}))}catch(e){}
  return list;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function callGemini(key,hist,round){
  round=round||0;
  const models=await gModels(key,round>0);
  const sys=`Você é o assistente financeiro de ${S.name||'um usuário'}, dentro do app Minhas Finanças. Responda em português do Brasil, de forma curta e direta (até uns 120 palavras), com valores em R$. Use SOMENTE os dados abaixo; se faltar informação, diga o que falta. Confira as contas antes de responder. Não recomende investimentos específicos.\n\nDADOS DO APP:\n${finCtx()}`;
  const body=JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:hist.map(m=>({role:m.r==='u'?'user':'model',parts:[{text:m.t}]})),generationConfig:{temperature:.5,maxOutputTokens:1500}});
  let last=null;
  for(const model of models){
    const base=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    let r;
    try{r=await fetch(base+'?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body})}
    catch(e1){
      try{r=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body})}
      catch(e2){throw new Error('Não consegui conectar ao Gemini ('+(e2.message||e1.message||'falha de rede')+'). Confira a internet e, se usar VPN, DNS filtrado ou bloqueador de conteúdo, desligue e tente de novo.')}
    }
    if(r.ok){const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
      if(t)return t;last='O Gemini não devolveu resposta. Tente reformular a pergunta.';continue}
    let msg='';try{msg=(await r.json()).error?.message||''}catch(e){}
    if(r.status===400&&/API key/i.test(msg))throw new Error('Chave inválida. Toque em Ajustes (⚙️) e cole a chave de novo.');
    if(r.status===403)throw new Error('Esta chave não tem permissão para o Gemini. Confira no Google AI Studio.');
    if([404,429,500,502,503,504].includes(r.status)){last=r.status;continue}   // tenta o próximo modelo
    throw new Error('O Gemini não respondeu ('+r.status+'). '+msg.slice(0,120));
  }
  if(round<1){await sleep(2500);return callGemini(key,hist,1)}
  if(last===429)throw new Error('O limite grátis do Gemini foi atingido por agora. Tente de novo em alguns minutos.');
  if(typeof last==='string')throw new Error(last);
  throw new Error('O Gemini está sobrecarregado neste momento (o Google avisa que é temporário). Tente de novo em um minuto.');
}
async function sendChat(text){
  if(chatBusy)return;const key=gKey();
  if(!key){A.gkey();return}
  if(!navigator.onLine){toast('Sem internet. O Chat precisa de conexão.');return}
  chatBusy=true;const hist=chatLoad();hist.push({r:'u',t:text});chatSave(hist);
  const lg=$('#chatlog');if(!lg.querySelector('.bub'))lg.innerHTML='';
  lg.insertAdjacentHTML('beforeend',bubble({r:'u',t:text})+'<div class="bub a typing" id="typ"><i></i><i></i><i></i></div>');
  scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  try{const ans=await callGemini(key,hist);hist.push({r:'a',t:ans});chatSave(hist);
    const typ=$('#typ');if(typ){typ.outerHTML=bubble({r:'a',t:ans})}}
  catch(e){const typ=$('#typ');if(typ)typ.outerHTML=`<div class="bub a" style="border-color:var(--rd)">${esc(e.message||'Algo deu errado.')}</div>`;hist.pop();chatSave(hist)}
  chatBusy=false;scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function countUp(el){
  const n=parseFloat(el.dataset.n);if(!isFinite(n)||n===0)return;
  const t0=performance.now(),D=800;
  (function step(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=brl(n*e);if(p<1)requestAnimationFrame(step);else el.textContent=brl(n)})(t0);
}

    <div class="btns"><button class="btn" data-a="shareBk">Compartilhar backup (Arquivos, iCloud…)</button></div>
    <div class="btns"><button class="btn sec" data-a="copyBk">Copiar como texto</button></div>
    <label style="margin-top:14px">Restaurar backup (escolha o arquivo ou cole o texto)</label>
    <input type="file" id="rf" accept=".json,application/json" style="margin-bottom:8px">
    <textarea id="rs" placeholder="Cole o backup aqui"></textarea>
    <div class="btns"><button class="btn" data-a="restore">Restaurar</button></div>
    <div class="btns"><button class="btn del" data-a="wipe">Apagar todos os dados</button></div>
    <div class="btns"><button class="btn sec" data-a="close">Fechar</button></div>
    <div class="mu" style="text-align:center;margin-top:12px">Versão do app: ${APP_VER}</div>`);
    const nm=$('#nm');if(nm)nm.onchange=()=>{S.name=nm.value.trim();save();render()};
    $('#bk').value=JSON.stringify(S);const rf=$('#rf');if(rf)rf.onchange=ev=>{const f=ev.target.files[0];if(f)f.text().then(t=>{$('#rs').value=t})};},
  setTheme(id){S.theme=id;save();applyTheme();A.settings()},
  copyBk(){S.lastBackup=today();save();const t=$('#bk');t.select();t.setSelectionRange(0,999999);try{navigator.clipboard.writeText(t.value).then(()=>alert('Backup copiado!'),()=>document.execCommand('copy')&&alert('Backup copiado!'))}catch(e){document.execCommand('copy');alert('Backup copiado!')}},
  restore(){try{const d=JSON.parse($('#rs').value);if(!d||!Array.isArray(d.cards))throw 0;if(!confirm('Isso substitui os dados atuais. Continuar?'))return;localStorage.setItem(KEY,JSON.stringify(d));load();applyTheme();applyHide();applyProfile();closeModal();render(true)}catch(e){alert('Backup inválido.')}},
  wipe(){if(confirm('Apagar TODOS os dados? Não dá para desfazer.')){localStorage.removeItem(KEY);load();applyTheme();applyHide();applyProfile();closeModal();render(true)}}
};

function confetti(){if(REDUCED)return;const cols=['#34d399','#22d3ee','#3b82f6','#fbbf24','#f472b6','#a78bfa'];
  for(let i=0;i<46;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};--d:${1.6+Math.random()*1.4}s;--dl:${Math.random()*.4}s;--x:${(Math.random()-.5)*160}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
function expForm(e){
  const cardOpts=S.cards.length?S.cards.map(c=>[c.id,c.name]):[['','(cadastre um cartão primeiro)']];
  const fields=[
    {k:'desc',label:'Descrição (ex.: Almoço)',value:e?.desc||''},
    {k:'value',label:e?'Valor (R$)':'Valor (R$) — total da compra',type:'money',value:e?.value||'',ph:'0,00'},
    {k:'category',label:'Categoria',type:'select',options:CATS.map(c=>[c,c]),value:e?.category||'Mercado'},
    {k:'method',label:'Forma de pagamento',type:'select',options:Object.entries(METHODS),value:e?.method||'card'},
    {k:'cardId',label:'Qual cartão?',type:'select',options:cardOpts,value:e?.cardId||'',showIf:['method','card']}];
  if(!e)fields.push({k:'parcelas',label:'Parcelas (1 = à vista)',type:'int',value:1,showIf:['method','card']});
  fields.push({k:'date',label:e?'Data':'Data da compra (1ª parcela)',type:'date',value:e?.date||today()});
  form({title:e?'Editar gasto':'Novo gasto',fields,
    validate:v=>v.value<=0?'Informe o valor.':(v.method==='card'&&!v.cardId)?'Escolha um cartão (cadastre na aba Cartões).':!v.date?'Informe a data.':(!e&&v.method==='card'&&(v.parcelas<1||v.parcelas>48))?'Parcelas: de 1 a 48.':'',
    onSave:v=>{
      if(v.method!=='card')v.cardId='';
      if(e){const wasCard=e.method==='card';const{parcelas,...rest}=v;Object.assign(e,rest);if(!(e.method==='card'&&wasCard))e.paid=false;return}
      const n=v.method==='card'?Math.max(1,v.parcelas||1):1;
      if(n>1){const gid=uid(),part=Math.floor(v.value/n*100)/100;let acc=0;
        for(let i=0;i<n;i++){const val=i===n-1?Math.round((v.value-acc)*100)/100:part;acc+=val;
          S.expenses.push({id:uid(),paid:false,gid,desc:(v.desc||v.category)+' ('+(i+1)+'/'+n+')',value:val,category:v.category,method:'card',cardId:v.cardId,date:addMonths(v.date,i)})}}
      else S.expenses.push({id:uid(),paid:false,desc:v.desc,value:v.value,category:v.category,method:v.method,cardId:v.cardId,date:v.date});
    },
    onDelete:e?()=>{if(e.gid&&confirm('Esta compra é parcelada. OK = excluir TODAS as parcelas. Cancelar = excluir só esta.'))S.expenses=S.expenses.filter(x=>x.gid!==e.gid);else S.expenses=S.expenses.filter(x=>x.id!==e.id)}:null});
}
const SALE_ITEMS=['Netflix','Prime Vídeo','Paramount','Max','Disney','Globo','Crunchyroll','Claro TV','Vivo Play','YouTube','ChatGPT','Super Duolingo','Gemini'];
function stForm(kind,e,pre){
  const isS=kind==='sales';pre=pre||{};
  form({title:e?(isS?'Editar venda':'Editar reposição'):pre.title||(isS?'Nova venda':'Nova reposição'),fields:[
    isS?{k:'desc',label:'O que vendeu?',type:'select',options:[['','Selecione…']].concat(SALE_ITEMS.map(x=>[x,x])).concat(e&&e.desc&&!SALE_ITEMS.includes(e.desc)?[[e.desc,e.desc]]:[]),value:e?.desc||''}
       :{k:'desc',label:'O que repôs?',type:'select',options:[['Estoque de contas','Estoque de contas'],['Reembolso','Reembolso']].concat(e&&e.desc&&!['Estoque de contas','Reembolso'].includes(e.desc)?[[e.desc,e.desc]]:[]),value:e?.desc||'Estoque de contas'},
    {k:'value',label:'Valor (R$)',type:'money',value:e?.value||pre.value||'',ph:'0,00'},
    {k:'date',label:'Data',type:'date',value:e?.date||pre.date||today()}],
    validate:v=>isS&&!v.desc?'Escolha o que vendeu.':v.value<=0?'Informe o valor.':!v.date?'Informe a data.':'',
    onSave:v=>{if(e)Object.assign(e,v);else S.store[kind].push({id:uid(),...v})},
    onDelete:e?()=>{S.store[kind]=S.store[kind].filter(x=>x.id!==e.id)}:null});
}
function incForm(e){
  form({title:e?'Editar entrada':'Nova entrada',fields:[
    {k:'desc',label:'Descrição (ex.: Venda de plano)',value:e?.desc||''},
    {k:'value',label:'Valor (R$)',type:'money',value:e?.value||'',ph:'0,00'},
    {k:'category',label:'Tipo',type:'select',options:INCOME_CATS.map(c=>[c,c]),value:e?.category||'Vendas'},
    {k:'date',label:'Data',type:'date',value:e?.date||today()}],
    validate:v=>v.value<=0?'Informe o valor.':!v.date?'Informe a data.':'',
    onSave:v=>{if(e)Object.assign(e,v);else S.income.push({id:uid(),...v})},
    onDelete:e?()=>{S.income=S.income.filter(x=>x.id!==e.id)}:null});
}
function moveForm(type,m){
  form({title:m?'Editar movimento':type==='in'?'Guardar dinheiro':'Retirar dinheiro',fields:[
    {k:'value',label:'Valor (R$)',type:'money',value:m?.value||''},
    {k:'pot',label:'Onde?',type:'select',options:POTS.map(p=>[p,p]),value:m?.pot||'Reserva'},
    {k:'note',label:'Observação (opcional)',value:m?.note||''},
    {k:'date',label:'Data',type:'date',value:m?.date||today()}],
    validate:v=>v.value<=0?'Informe o valor.':'',
    onSave:v=>{if(m)Object.assign(m,v);else S.reserve.moves.push({id:uid(),type,...v})},
    onDelete:m?()=>{S.reserve.moves=S.reserve.moves.filter(x=>x.id!==m.id)}:null});
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(f)f(b.dataset.id)});

/* ---------- ícone do app (tela inicial do iPhone) ---------- */
function makeIcon(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#22d3ee');g.addColorStop(1,'#2563eb');x.fillStyle=g;x.fillRect(0,0,180,180);
  x.beginPath();x.arc(90,90,60,0,7);x.fillStyle='rgba(255,255,255,.16)';x.fill();x.lineWidth=6;x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font='bold 56px -apple-system,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('R$',90,94);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}}

load();applyTheme();applyHide();applyProfile();makeIcon();render(true);
/* Entrada automática vinda do Atalho do iPhone: ?t=sale|restock&v=7,00&d=2026-11-20 */
(function(){try{
  const q=new URLSearchParams(location.search),t=q.get('t');if(!t)return;
  history.replaceState(null,'',location.pathname);
  let raw=(q.get('v')||'').replace(/[^\d.,]/g,'');
  const v=raw.includes(',')?num(raw):parseFloat(raw)||0;
  const d=/^\d{4}-\d{2}-\d{2}$/.test(q.get('d')||'')?q.get('d'):today();
  if(!(v>0))return;
  S.profile='store';save();applyProfile();tab=t==='sale'?'sled':'shome';ssub=t==='sale'?'sale':'restock';render(true);
  setTimeout(()=>{if(t==='sale')stForm('sales',null,{title:'💰 Venda recebida (Mercado Pago)',desc:'Venda Pix',value:v,date:d});
    else stForm('restock',null,{title:'📦 Pix enviado — é reposição?',value:v,date:d})},350);
}catch(e){}})();
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='update')toast('Nova versão disponível',{label:'Atualizar',fn:()=>location.reload()})})}
</script>
